<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --icon-user-bg: #f6f8fa;
            --icon-ai-bg: #34903E;
            --icon-user-text: #1f2328;
            --icon-ai-text: #ffffff; 
            --code-bg: #f6f8fa;
            --code-text: #1f2328;
            --border-subtle: #d0d7de;
            --inline-code-color: #E46C2C;
        }

        body.dark-mode {
            --bg-color: #1c1c1c;
            --text-primary: #e3e3e3;
            --text-secondary: #8b8b8b;
            --icon-user-bg: #3d3d3d;
            --icon-user-text: #e3e3e3;
            --code-bg: #0d1117;
            --code-text: #c9d1d9;
            --border-subtle: #30363d;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 0 120px 0;
            font-size: 16px;
            line-height: 1.6;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .chat-container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
        .message { display: flex; gap: 16px; padding: 24px 0; opacity: 0; animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .avatar {
            width: 32px; height: 32px; min-width: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; overflow: hidden;
            background-size: cover; background-position: center;
        }

        .message.user .avatar { background-color: var(--icon-user-bg); color: var(--icon-user-text); }
        .message.ai .avatar { background-color: var(--icon-ai-bg); color: var(--icon-ai-text); }
        .content-wrapper { flex: 1; min-width: 0; }
        .msg-header { font-weight: 600; margin-bottom: 4px; font-size: 14px; text-transform: uppercase; color: var(--text-secondary); }
        .msg-body { word-wrap: break-word; font-size: 16px; }

        /* Formatting Fixes */
        pre { background-color: var(--code-bg); color: var(--code-text); padding: 16px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border-subtle); margin: 1em 0; }
        code { font-family: 'JetBrains Mono', monospace; font-size: 14px; }
        p > code { background-color: var(--code-bg); color: var(--inline-code-color); padding: 2px 6px; border-radius: 4px; }

        ul, ol { padding-left: 1.5em; margin: 1em 0; }
        li { margin-bottom: 0.5em; }
        p { margin: 1em 0; }
        p:first-child { margin-top: 0; }
        p:last-child { margin-bottom: 0; }

        table { border-collapse: collapse; width: 100%; margin: 1em 0; border: 1px solid var(--border-subtle); }
        th, td { border: 1px solid var(--border-subtle); padding: 8px 12px; text-align: left; }
        th { background-color: var(--code-bg); }

        blockquote { border-left: 4px solid var(--icon-ai-bg); margin: 1em 0; padding-left: 16px; color: var(--text-secondary); font-style: italic; }
    </style>
    <!-- Use local-safe scripts with explicit loading check -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div id="chat-container" class="chat-container"></div>
    <script>
        var aiLogoB64 = "";

        // Function to safely highlight code blocks
        function highlightAll() {
            if (typeof hljs !== 'undefined') {
                var blocks = document.querySelectorAll('pre code');
                for (var i = 0; i < blocks.length; i++) {
                    hljs.highlightBlock(blocks[i]);
                }
            }
        }

        function safeParseMarkdown(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse(text);
            }
            // Basic fallback for line breaks
            return text.replace(/\n/g, '<br>');
        }

        function b64DecodeUnicode(str) {
            try {
                return decodeURIComponent(atob(str).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch(e) { return atob(str); }
        }

        function setAiLogo(base64) {
            aiLogoB64 = base64;
            var avatars = document.querySelectorAll('.message.ai .avatar');
            for(var i=0; i<avatars.length; i++) {
                avatars[i].style.backgroundImage = 'url(data:image/png;base64,' + base64 + ')';
                avatars[i].innerHTML = "";
            }
        }

        function appendMessage(id, role, base64InitialText) {
            var text = base64InitialText ? b64DecodeUnicode(base64InitialText) : "";
            var container = document.getElementById('chat-container');
            if (!container) return;

            var div = document.createElement("div");
            div.id = id;
            div.className = "message " + role;
            
            var avatar = document.createElement("div");
            avatar.className = "avatar";
            if (role === 'ai' && aiLogoB64) {
                avatar.style.backgroundImage = 'url(data:image/png;base64,' + aiLogoB64 + ')';
                avatar.innerHTML = "";
            } else {
                avatar.innerHTML = role === 'user' ? "U" : "A";
            }
            div.appendChild(avatar);

            var wrapper = document.createElement("div");
            wrapper.className = "content-wrapper";
            var header = document.createElement("div");
            header.className = "msg-header";
            header.innerText = role === 'user' ? "You" : "Academia ChatAI";
            wrapper.appendChild(header);

            var body = document.createElement("div");
            body.className = "msg-body";
            body.innerHTML = safeParseMarkdown(text);
            wrapper.appendChild(body);

            div.appendChild(wrapper);
            container.appendChild(div);

            highlightAll();
            window.scrollTo(0, document.body.scrollHeight);
        }

        function updateMessage(id, base64FullText) {
            var text = b64DecodeUnicode(base64FullText);
            var div = document.getElementById(id);
            if (div) {
                var body = div.querySelector('.msg-body');
                if (body) {
                    body.innerHTML = safeParseMarkdown(text);
                    highlightAll();
                }
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        function clearMessages() {
            var container = document.getElementById('chat-container');
            if (container) container.innerHTML = '';
        }

        function setTheme(isDark) {
            var body = document.body;
            if (!body) return;
            if (isDark) {
                body.classList.add('dark-mode');
                var themeLink = document.getElementById('hljs-theme');
                if (themeLink) themeLink.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css";
            } else {
                body.classList.remove('dark-mode');
                var themeLink = document.getElementById('hljs-theme');
                if (themeLink) themeLink.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
            }
        }
    </script>
</body>
</html>
